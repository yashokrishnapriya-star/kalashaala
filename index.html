<title>Kalashaala | Dance & Arts Academy</title>

<style>
:root{
  --primary:#6d28d9;
  --secondary:#f59e0b;
  --dark:#0f172a;
  --light:#f8fafc;
  --text:#334155;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Mukta',sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.6;
}

html{
  scroll-behavior:smooth;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

/* Navbar */
nav{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
  z-index:1000;
  box-shadow:0 2px 15px rgba(0,0,0,0.08);
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
}

.logo{
  font-size:28px;
  font-weight:700;
  color:var(--primary);
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  text-decoration:none;
  color:var(--dark);
  font-weight:500;
}

.nav-links a:hover{
  color:var(--primary);
}

.hero{

  background-position:center;
  display:flex;
  align-items:center;
  text-align:center;
  color:white;
}

.hero-content{
  width:100%;
}

  font-size:4rem;
  margin-bottom:20px;
}
