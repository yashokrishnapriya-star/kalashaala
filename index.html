 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALASHAALA | Dance & Arts Academy</title>

  <!-- Import Mukta font -->
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Mukta', sans-serif;
    }

    /* Hero background collage */
    .hero {
      height: 100vh;
      background: 
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase; /* makes KALASHAALA all caps */
    }

    .hero h2 {
      font-size: 32px;
      font-family: serif;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    .btn {
      background: white;
      color: black;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f59e0b;
      color: white;
    }

    /* Sections hidden until button clicked */
    .section {
      display: none;
      padding: 40px;
      text-align: center;
    }

    .section h3 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #0f172a;
    }

    .section p {
      font-size: 18px;
      margin: 8px 0;
    }
  </style>

  <script>
    function showSection(id) {
      document.querySelectorAll('.section').forEach(sec => sec.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      window.scrollTo(0, document.body.scrollHeight);
    }
  </script>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <h1>KALASHAALA</h1>
    <h2>Find your true self</h2>
    <div class="buttons">
      <button class="btn" onclick="showSection('contact')">Contact</button>
      <button class="btn" onclick="showSection('about')">About Us</button>
    </div>
  </section>

  <!-- Contact Section -->
  <section id="contact" class="section">
    <h3>Contact Information</h3>
    <p>📞 Phone: 9036939484</p>
    <p>📧 Gmail: yashokrishnapriya@gmail.com</p>
    <p>💬 WhatsApp: 9916866337</p>
  </section>

  <!-- About Us Section -->
  <section id="about" class="section">
    <h3>About the Founder</h3>
    <p>Founder information goes here. (You can add biography, vision, and achievements.)</p>
  </section>

</body>
</html>
