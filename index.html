<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalashaala</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      text-align:center;
      background:#f8f4ef;
    }
    header{
      background:#7b2cbf;
      color:white;
      padding:60px 20px;
    }
    section{
      padding:40px 20px;
    }
    .card{
      max-width:800px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.1);
    }
  </style>
</head>
<body>
  <header>
    <h1>Kalashaala</h1>
    <p>Dance • Arts • Culture</p>
  </header>

  <section>
    <div class="card">
      <h2>Welcome</h2>
      <p>
        Kalashaala is a platform dedicated to promoting dance,
        performing arts, cultural events and creative learning.
      </p>

      <h3>Coming Soon</h3>
      <p>Classes, Events, Workshops and Artist Community.</p>
    </div>
  </section>
</body>
</html>
